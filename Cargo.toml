[package]
name = "chorts"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "a library to run and visit cargo check|clippy"
authors = [ "museun <museun@users.noreply.github.com>" ]
repository = "https://github.com/museun/chorts"

[features]
default = [  ]
clap = [ "dep:clap" ]
anstyle = [ "dep:anstyle" ]

[dependencies]
anstyle = { version = "1.0.10", optional = true }
clap = { version = "4.5.37", features = [ "std" ], default-features = false, optional = true }
displaydoc = "0.2.5"
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
str_indices = "0.4.4"
thiserror = "2.0.12"
