[package]
name = "chorts"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "a library to run and visit cargo check|clippy"
authors = [ "museun <museun@users.noreply.github.com>" ]
repository = "https://github.com/museun/chorts"

[features]
clap = [ "dep:clap" ]

[dependencies]
# TODO get rid of this in favor of thiserror
anyhow = "1.0.95"
clap = { version = "4.5.27", default-features = false, optional = true }
serde = { version = "1.0.217", features = [ "derive" ] }
serde_json = "1.0.138"
