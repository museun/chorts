[package]
name = "chorts"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "a library to run and visit cargo check|clippy"
authors = [ "museun <museun@users.noreply.github.com>" ]
repository = "https://github.com/museun/chorts"

[features]
clap = [ "dep:clap" ]

[dependencies]
clap = { version = "4.5.34", default-features = false, optional = true }
displaydoc = "0.2.5"
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.140"
thiserror = "2.0.12"
